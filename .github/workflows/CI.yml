name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    steps:
      # Checkout the repository
      - uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      # Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r project/requirements.txt

      # Run Django tests
      - name: Run Tests
        run: |
          python project/manage.py test

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Set up Docker Buildx (optional, remove if not needed for multi-platform builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ruizhong123/project_version5-web:latest

      # Pull and run the Docker image for testing
      - name: Pull and run the Docker image

        run: |

          docker pull ruizhong123/project_version5-web:latest
          docker run -d -p 8080:8000 --name project_version5-web ruizhong123/project_version5-web:latest
          sleep 5 # Wait for the container to start
          curl -f http://localhost:8080 || exit 1 # Basic health check






